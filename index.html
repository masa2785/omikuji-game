<!DOCTYPE html>
<html lang="en">

  <head>
    <meta charset="UTF-8">
    <title>今日のおみくじ</title>
    <link rel="stylesheet" href="./style.css">

  </head>
    
  <body>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;700;900&display=swap" rel="stylesheet">

<div class="wrap">
  <div class="title">✦ 今日のおみくじ ✦</div>
  <div class="subtitle">ボタンを押してルーレットを回そう</div>

  <div class="roulette-container">
    <canvas id="wheel" width="280" height="280"></canvas>
    <div class="needle"></div>
  </div>

  <button class="spin-btn" id="spinBtn" onclick="spin()">おみくじを引く</button>

  <div class="result-box" id="resultBox">
    <div class="fortune-badge hidden" id="fortuneBadge"></div>
    <div class="fortune-text hidden" id="fortuneText"></div>
  </div>
</div>
    <script  src="./script.js"></script>

  </body>
  
</html>
